{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Kifaru ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/kifaru.css' %}">
    <style>
        body { margin:0; font-family:Inter,sans-serif; background:#f6f7fb; color:#111827; }
        .login-shell { min-height:100vh; display:grid; place-items:center; padding:24px; }
        .login-card { width:min(420px,100%); background:#fff; border:1px solid #e5e7eb; border-radius:18px; padding:32px; box-shadow:0 18px 45px rgba(15,23,42,.08); }
        .brand { font-size:26px; font-weight:800; margin-bottom:8px; }
        .muted { color:#6b7280; margin:0 0 24px; }
        label { display:block; font-weight:600; margin:14px 0 6px; }
        input { width:100%; box-sizing:border-box; padding:12px 14px; border:1px solid #d1d5db; border-radius:10px; font:inherit; }
        button { width:100%; margin-top:20px; border:0; border-radius:10px; padding:13px 16px; font:inherit; font-weight:700; background:#111827; color:#fff; cursor:pointer; }
        .error { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; padding:10px 12px; border-radius:10px; margin-bottom:14px; }
    </style>
</head>
<body>
<div class="login-shell">
    <form method="post" class="login-card">
        {% csrf_token %}
        <div class="brand">Kifaru ERP</div>
        <p class="muted">Sign in to your business workspace.</p>
        {% if form.errors %}<div class="error">The username or password is incorrect.</div>{% endif %}
        <label for="id_username">Username</label>
        {{ form.username }}
        <label for="id_password">Password</label>
        {{ form.password }}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button type="submit">Sign in</button>
    </form>
</div>
</body>
</html>
